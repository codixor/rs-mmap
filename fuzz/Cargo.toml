[package]
name = "rs-mmap-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[lints.rust]
unsafe_code = "forbid"

[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
rs-mmap = { path = "..", version = "0.4", features = ["zerocopy-views"] }
tempfile = "3.27"

[[bin]]
name = "slice_views"
path = "fuzz_targets/slice_views.rs"
test = false
doc = false
bench = false

[[bin]]
name = "file_windows"
path = "fuzz_targets/file_windows.rs"
test = false
doc = false
bench = false
