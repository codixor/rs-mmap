name: Rust 1.99 checks

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.99.0

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --all-features
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  fuzz-and-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-fuzz@0.13.2,cargo-deny@0.22.0
      - run: cargo deny --locked --all-features check
      - run: cargo deny --manifest-path fuzz/Cargo.toml --locked --all-features check --config deny.toml
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo fuzz run --sanitizer none slice_views -- -runs=20000 -max_len=256 -timeout=5 -rss_limit_mb=512
      - run: cargo fuzz run --sanitizer none file_windows -- -runs=20000 -max_len=8 -timeout=5 -rss_limit_mb=512
