[package]
name = "rs-mmap"
description = "Safe file snapshots, verified and trusted memory maps, and typed records"
readme = "README.md"
repository = "https://github.com/codixor/rs-mmap"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
version = "0.3.0"
include = ["/src/**", "/tests/**", "/examples/**", "/benches/**", "/Cargo.toml", "/Cargo.lock", "/rust-toolchain.toml", "/README.md", "/LICENSE-*"]
keywords = ["mmap", "memmap", "bytes", "io"]
categories = ["filesystem", "memory-management"]

[lib]
name = "rs_mmap"

[dependencies]
thiserror = "2.0.18"
zerocopy = { version = "0.8.48", default-features = false, optional = true }
bytemuck = { version = "1.25.0", default-features = false, optional = true }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"], optional = true }

[target.'cfg(any(unix, windows))'.dependencies]
memmap2 = "0.9.12"

[dev-dependencies]
tempfile = "3.27.0"
serde_json = { version = "1.0.149", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", optional = true, features = ["thread"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[features]
default = []
huge-pages = []
numa = ["dep:rustix"]
unstable = ["numa", "huge-pages"]
zerocopy-views = ["dep:zerocopy", "dep:bytemuck"]
serde-support = ["dep:serde"]

[[bench]]
name = "mmap_core"
harness = false

[[bench]]
name = "file_windows"
harness = false

[lints.rust]
# Denied crate-wide. src/trusted.rs is the only module allowed to opt out.
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"
panic = "unwind"
incremental = false
overflow-checks = false

[profile.min-size]
inherits = "release"
opt-level = "z"
panic = "abort"

[profile.release-debuginfo]
inherits = "release"
debug = "line-tables-only"
strip = "none"
split-debuginfo = "packed"
