[package]
name = "rs-mmap"
description = "Typed memory-mapped files and reusable read-only mapping windows"
readme = "README.md"
repository = "https://github.com/codixor/rs-mmap"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
version = "0.2.2"
include = ["/src/**", "/tests/**", "/examples/**", "/benches/**", "/Cargo.toml", "/Cargo.lock", "/rust-toolchain.toml", "/README.md", "/LICENSE-*"]
keywords = ["mmap", "memmap", "bytes", "io"]
categories = ["filesystem", "memory-management"]

[lib]
name = "rs_mmap"

[dependencies]
thiserror = "2.0.18"
zerocopy = { version = "0.8.48", default-features = false, optional = true }
bytemuck = { version = "1.25.0", default-features = false, optional = true }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"], optional = true }

[target.'cfg(any(unix, windows))'.dependencies]
memmap2 = "=0.9.12"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.185", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
] }

[dev-dependencies]
tempfile = "3.27.0"
serde_json = { version = "1.0.149", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio]
version = "1.52.1"
default-features = false
features = ["rt", "fs", "io-util", "macros"]
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
memchr = "2.8"

[features]
default = []
huge-pages = []
numa = []
async = ["dep:tokio"]
zerocopy-views = ["dep:zerocopy", "dep:bytemuck"]
serde-support = ["dep:serde"]

[[bench]]
name = "mmap_core"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[[bench]]
name = "compare"
harness = false

[[bench]]
name = "log_1gb"
harness = false

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"
panic = "unwind"
incremental = false
overflow-checks = false

[profile.min-size]
inherits = "release"
opt-level = "z"
panic = "abort"

[profile.release-debuginfo]
inherits = "release"
debug = "line-tables-only"
strip = "none"
split-debuginfo = "packed"
