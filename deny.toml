[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"

[licenses]
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
# The fuzz-only binding includes LLVM's NCSA-licensed libFuzzer runtime.
exceptions = [{ crate = "libfuzzer-sys", allow = ["NCSA"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
